name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build # typechecks, then bundles

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          load: true
          tags: faux-idc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name faux-idc -p 8080:8080 faux-idc:ci
          for _ in $(seq 1 30); do curl -sf http://localhost:8080/healthz && break; sleep 1; done
          curl -sf http://localhost:8080/.well-known/openid-configuration | jq -e '.issuer == "http://localhost:8080"'
          curl -sf http://localhost:8080/.well-known/jwks.json | jq -e '.keys[0].alg == "RS256"'
          curl -sf http://localhost:8080/token -d grant_type=password -d client_id=ci \
            -d username=alice -d password=letmein -d claim_set=admin | jq -e '.access_token and .id_token'

      # Pinned to a commit: trivy-action tags were force-pushed to malicious commits in March 2026 (CVE-2026-33634).
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: faux-idc:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Container logs
        if: always()
        run: docker logs faux-idc || true
